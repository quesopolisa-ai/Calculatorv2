<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calculator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0c0c0f; color: #e8e8ec;
    font-family: 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  .screen {
    position: fixed; inset: 0; overflow-y: auto;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    opacity: 0; pointer-events: none; transform: scale(.985);
    transition: opacity .25s ease, transform .25s ease;
  }
  .screen.active { opacity: 1; pointer-events: auto; transform: scale(1); }

  /* ═══════════ CALCULATOR ═══════════ */
  .calc { width: 100%; max-width: 380px; user-select: none; }
  .brandrow {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #888; }
  .histbtn {
    background: none; border: none; color: #555; font-size: 11px;
    font-weight: 700; letter-spacing: 1px; cursor: pointer;
  }
  .histbtn:hover { color: #999; }

  .display {
    position: relative;
    background: #15151a; border: 1px solid #232329; border-radius: 12px;
    padding: 18px 16px 14px; margin-bottom: 12px; text-align: right;
  }
  .d-small {
    min-height: 18px; font-size: 14px; color: #5a5a66;
    font-family: Consolas, monospace; word-break: break-all;
    overflow-x: auto; white-space: nowrap;
  }
  .d-big {
    font-size: 34px; font-weight: 300; margin-top: 4px;
    font-family: Consolas, monospace; word-break: break-all;
    overflow-x: auto; white-space: nowrap; line-height: 1.15;
  }
  .d-big.err { color: #ff6b6b; font-size: 22px; }
  .d-flags {
    position: absolute; top: 8px; left: 12px;
    font-size: 10px; color: #555; font-weight: 700; letter-spacing: 1px;
    display: flex; gap: 8px;
  }
  #secretDot {
    position: absolute; top: 9px; right: 12px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #3a3a44; cursor: pointer; display: none;
  }
  #secretDot.on { display: block; }
  #secretDot:hover { background: #c62f2f; }

  .histpanel {
    display: none; background: #131318; border: 1px solid #232329;
    border-radius: 10px; margin-bottom: 12px; padding: 6px;
    max-height: 180px; overflow-y: auto;
  }
  .histpanel.open { display: block; }
  .hitem {
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    font-family: Consolas, monospace; font-size: 12px;
  }
  .hitem:hover { background: #1d1d24; }
  .hitem .he { color: #666; word-break: break-all; }
  .hitem .hr { color: #e8e8ec; font-size: 14px; }
  .hempty { color: #444; font-size: 11px; text-align: center; padding: 12px; }

  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .k {
    height: 58px; border: none; border-radius: 10px; cursor: pointer;
    font-size: 19px; font-weight: 600; color: #e8e8ec;
    background: #1a1a20; transition: background .1s, transform .05s;
    font-family: inherit;
  }
  .k:active { transform: scale(.93); }
  .k.fn  { background: #14141a; color: #7a7a88; font-size: 15px; }
  .k.fn:hover { background: #1c1c24; }
  .k.op  { background: #20202a; color: #ff8a8a; font-size: 21px; }
  .k.op:hover { background: #2a2a36; }
  .k.num { background: #22222a; font-size: 21px; }
  .k.num:hover { background: #2c2c36; }
  .k.util { background: #14141a; color: #8888a0; font-size: 15px; }
  .k.util:hover { background: #1c1c24; }
  .k.eq { grid-column: span 2; background: #c62f2f; color: #fff; font-size: 23px; }
  .k.eq:hover { background: #e03a3a; }
  .k.second-on { background: #3a2a10 !important; color: #ffc46b !important; }

  /* ═══════════ LAUNCHER ═══════════ */
  .wrap { width: 100%; max-width: 560px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 20px; letter-spacing: 1px; }
  h1 span { color: #ff5c5c; }
  .storebtn {
    background: #1e1e26; border: 1px solid #3a3a46; color: #ccc;
    border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .storebtn:hover { background: #26262e; color: #fff; }
  .lockbtn {
    background: none; border: none; color: #444; font-size: 20px; cursor: pointer;
    line-height: 1; padding: 0 10px 0 0;
  }
  .lockbtn:hover { color: #888; }
  .hgroup { display: flex; gap: 8px; }

  .addbox {
    background: #17171c; border: 2px dashed #2c2c36; border-radius: 10px;
    padding: 26px 16px; text-align: center; margin-bottom: 14px;
    cursor: pointer; transition: border-color .15s;
  }
  .addbox:hover, .addbox.drag { border-color: #ff5c5c; }
  .addbox .big { font-size: 26px; line-height: 1; margin-bottom: 8px; }
  .addbox .t1 { font-size: 14px; font-weight: 600; }
  .addbox .t2 { font-size: 11px; color: #666; margin-top: 4px; }

  .listhead { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 8px; }
  .listhead span { font-size: 11px; color: #666; letter-spacing: 1px; font-weight: 600; }
  .clearall { background: none; border: none; color: #ff6b6b; font-size: 11px; cursor: pointer; }
  .filecard {
    background: #17171c; border: 1px solid #26262e; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px;
  }
  .ficon {
    width: 38px; height: 38px; flex-shrink: 0; border-radius: 8px;
    background: #1e1e26; display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #ff5c5c; font-weight: 700;
  }
  .fmeta { flex: 1; min-width: 0; }
  .fname { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .finfo { font-size: 10px; color: #666; margin-top: 3px; font-family: Consolas, monospace; }
  .fbtns { display: flex; gap: 6px; flex-shrink: 0; }
  .runbtn {
    background: #c62f2f; color: #fff; border: none; border-radius: 6px;
    padding: 9px 18px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .runbtn:hover { background: #e03a3a; }
  .rembtn {
    background: #1e1e26; color: #ff6b6b; border: 1px solid #3a3a46;
    border-radius: 6px; padding: 9px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .rembtn:hover { background: #2c1e1e; }
  .empty { text-align: center; color: #444; font-size: 12px; padding: 30px 0; }

  /* ═══════════ SAVE SYSTEM (.launchpad) ═══════════ */
  .packrow {
    display: flex; gap: 8px; margin-bottom: 8px;
  }
  .packbtn {
    flex: 1; padding: 11px 8px; border-radius: 8px; font-size: 12px;
    font-weight: 700; cursor: pointer; letter-spacing: .5px;
    background: #1a2a1e; color: #6fcf6f; border: 1px solid #2a4a30;
  }
  .packbtn:hover { background: #223a28; }
  .packbtn.red { background: #2a2026; color: #e8a0e8; border: 1px solid #4a3040; }
  .packbtn.red:hover { background: #362830; }

  .settings {
    background: #17171c; border: 1px solid #26262e; border-radius: 10px;
    padding: 14px; margin-top: 14px; display: none;
  }
  .settings.open { display: block; }
  .settings h2 { font-size: 11px; color: #888; letter-spacing: 1px; margin-bottom: 10px; }
  .setrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .setrow label { font-size: 12px; color: #aaa; }
  .setrow .hint { font-size: 10px; color: #555; display: block; margin-top: 2px; }
  .seg { display: flex; gap: 4px; flex-shrink: 0; }
  .seg button {
    background: #1e1e26; border: 1px solid #2c2c36; color: #888;
    border-radius: 4px; padding: 7px 12px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .seg button.active { background: #26262e; color: #fff; border-color: #3a3a46; }
  .cloakrow { display: flex; gap: 6px; margin-bottom: 10px; }
  .cloakrow input {
    flex: 1; background: #101014; border: 1px solid #2c2c36; color: #e8e8ec;
    border-radius: 4px; padding: 9px; font-size: 12px; outline: none;
  }
  .checkrow { display: flex; gap: 16px; font-size: 12px; color: #888; }
  .checkrow input { accent-color: #ff5c5c; }
  .fullbtn {
    width: 100%; background: #1e1e26; color: #ccc; border: 1px solid #3a3a46;
    border-radius: 6px; padding: 10px; font-size: 12px; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }
  .fullbtn:hover { background: #26262e; color: #fff; }

  #status {
    margin-top: 12px; font-size: 11px; color: #666;
    font-family: Consolas, monospace; min-height: 14px; word-break: break-all;
  }
  #status.ok { color: #6fcf6f; }
  #status.err { color: #ff6b6b; }
</style>
</head>
<body>

<!-- ═══════════ SCREEN 1: CALCULATOR ═══════════ -->
<div id="calcScreen" class="screen active">
  <div class="calc">
    <div class="brandrow">
      <div class="brand">Calculator</div>
      <button class="histbtn" id="histBtn">HISTORY</button>
    </div>

    <div class="histpanel" id="histPanel"></div>

    <div class="display">
      <div class="d-flags"><span id="flagDeg">DEG</span><span id="flagMem" style="display:none">M</span></div>
      <div id="secretDot" title=""></div>
      <div class="d-small" id="dSmall"></div>
      <div class="d-big" id="dBig">0</div>
    </div>

    <div class="keypad">
      <button class="k util" id="k2nd">2nd</button>
      <button class="k util" id="kDeg">DEG</button>
      <button class="k fn" data-fn="sin">sin</button>
      <button class="k fn" data-fn="cos">cos</button>
      <button class="k fn" data-fn="tan">tan</button>

      <button class="k fn" data-fn="ln">ln</button>
      <button class="k fn" data-fn="log">log</button>
      <button class="k fn" data-fn="sqrt">√</button>
      <button class="k fn" data-ins="^">xʸ</button>
      <button class="k fn" data-ins="!">n!</button>

      <button class="k fn" data-ins="π">π</button>
      <button class="k fn" data-ins="e">e</button>
      <button class="k fn" data-ins="(">(</button>
      <button class="k fn" data-ins=")">)</button>
      <button class="k fn" data-ins="%">%</button>

      <button class="k util" id="kC">C</button>
      <button class="k util" id="kBack">⌫</button>
      <button class="k op" data-ins="÷">÷</button>
      <button class="k op" data-ins="×">×</button>
      <button class="k util" data-ins="ans">ANS</button>

      <button class="k num" data-ins="7">7</button>
      <button class="k num" data-ins="8">8</button>
      <button class="k num" data-ins="9">9</button>
      <button class="k util" id="kMPlus">M+</button>
      <button class="k util" id="kMR">MR</button>

      <button class="k num" data-ins="4">4</button>
      <button class="k num" data-ins="5">5</button>
      <button class="k num" data-ins="6">6</button>
      <button class="k util" id="kMS">MS</button>
      <button class="k util" id="kMC">MC</button>

      <button class="k num" data-ins="1">1</button>
      <button class="k num" data-ins="2">2</button>
      <button class="k num" data-ins="3">3</button>
      <button class="k fn" data-ins="%">%</button>
      <button class="k util" id="kNeg">±</button>

      <button class="k num" data-ins="0">0</button>
      <button class="k num" data-ins=".">.</button>
      <button class="k op" data-ins="+">+</button>
      <button class="k eq" id="kEq">=</button>
    </div>
  </div>
</div>

<!-- ═══════════ SCREEN 2: LAUNCHER (secret) ═══════════ -->
<div id="launcherScreen" class="screen">
  <div class="wrap">
    <header>
      <h1>HTML <span>LAUNCHER</span></h1>
      <div class="hgroup">
        <button class="lockbtn" id="lockBtn" title="">•</button>
        <button class="storebtn" onclick="toggleSettings()">CONFIG</button>
      </div>
    </header>

    <div class="addbox" id="addbox" onclick="pickFile()">
      <div class="big">+</div>
      <div class="t1">Add HTML files</div>
      <div class="t2">tap to browse or drop files here — saved permanently on this device</div>
    </div>
    <input type="file" id="fileInput" accept=".html,.htm,text/html" multiple style="display:none">

    <!-- ══ SAVE SYSTEM: export / import .launchpad ══ -->
    <div class="packrow">
      <button class="packbtn" onclick="exportPack()">💾 SAVE LIBRARY (.launchpad)</button>
      <button class="packbtn red" onclick="importPack()">📂 LOAD .launchpad</button>
    </div>
    <input type="file" id="packInput" accept=".launchpad,.json" style="display:none">

    <div class="listhead">
      <span id="listCount">LIBRARY — 0 FILES</span>
      <button class="clearall" onclick="clearAll()">REMOVE ALL</button>
    </div>
    <div id="fileList"></div>
    <div class="empty" id="emptyMsg">library is empty — add some .html files above</div>

    <div class="settings" id="settings">
      <h2>RUN CONFIG</h2>
      <div class="setrow">
        <div>
          <label>Launch method</label>
          <span class="hint">about:blank = clean address bar | blob: = blob URL tab</span>
        </div>
        <div class="seg">
          <button id="modeBlank" onclick="setMode('blank')">about:blank</button>
          <button id="modeBlob" onclick="setMode('blob')">blob:</button>
        </div>
      </div>
      <h2 style="margin-top:14px">TAB CLOAK (applies to launched tabs)</h2>
      <div class="cloakrow">
        <input type="text" id="titleInput" placeholder="Tab title">
        <input type="text" id="iconInput" placeholder="Favicon URL">
      </div>
      <div class="checkrow">
        <label><input type="checkbox" id="fullscreenChk"> fullscreen launched tab</label>
      </div>
      <button class="fullbtn" onclick="selfCloak()">CLOAK THIS TAB</button>
    </div>

    <div id="status"></div>
  </div>
</div>

<script>
// ═══════════════ SCREEN MANAGER ═══════════════
function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

// ═════════════════════════════════════════════════════════
//  CALCULATOR ENGINE
// ═════════════════════════════════════════════════════════
(function() {
  var SECRET = 3396981;

  var expr = '';
  var mode = 'input';
  var lastResult = 0;
  var ans = 0;
  var mem = 0;
  var deg = true;
  var second = false;
  var unlocked = false;

  var dSmall = document.getElementById('dSmall');
  var dBig = document.getElementById('dBig');
  var flagDeg = document.getElementById('flagDeg');
  var flagMem = document.getElementById('flagMem');
  var secretDot = document.getElementById('secretDot');

  try { mem = parseFloat(localStorage.getItem('calc_mem')) || 0; } catch (e) {}
  try { unlocked = sessionStorage.getItem('lx_unlocked') === '1'; } catch (e) {}
  if (unlocked) secretDot.classList.add('on');
  if (mem !== 0) flagMem.style.display = '';

  // ── TOKENIZER ──
  var FUNCS = ['asin','acos','atan','tenpow','sqrt','sin','cos','tan','log','exp','ln','ans','neg'];
  var POSTFIX = { '!': true, '%': true };

  function tokenize(src) {
    var toks = [];
    var i = 0, n = src.length;
    var prevKind = null;

    function isDigit(c) { return c >= '0' && c <= '9'; }
    function isLetter(c) { return /[a-zA-Z]/.test(c); }

    while (i < n) {
      var c = src[i];
      if (c === ' ') { i++; continue; }

      var kind = null;
      var tok = null;

      if (isDigit(c) || (c === '.' && isDigit(src[i+1] || ''))) {
        var j = i;
        while (j < n && (isDigit(src[j]) || src[j] === '.')) j++;
        tok = { t: 'num', v: parseFloat(src.slice(i, j)) };
        kind = 'num';
        i = j;
      }
      else if (isLetter(c) || c === '√') {
        var matched = null, mLen = 0;
        var rest = src.slice(i).toLowerCase();
        for (var f = 0; f < FUNCS.length; f++) {
          var fn = FUNCS[f];
          if (rest.indexOf(fn) === 0 && fn.length > mLen) { matched = fn; mLen = fn.length; }
        }
        if (c === '√') { matched = 'sqrt'; mLen = 1; }
        if (!matched && c.toLowerCase() === 'e') { matched = 'e'; mLen = 1; }
        if (!matched) throw 'Syntax';
        if (matched === 'e') { tok = { t: 'num', v: Math.E }; kind = 'const'; }
        else if (matched === 'ans') { tok = { t: 'num', v: ans }; kind = 'const'; }
        else { tok = { t: 'func', v: matched }; kind = 'func'; }
        i += mLen;
      }
      else if (c === 'π') { tok = { t: 'num', v: Math.PI }; kind = 'const'; i++; }
      else if ('+-*/^'.indexOf(c) >= 0) {
        var map = { '+': '+', '-': '-', '*': '*', '/': '/', '^': '^', '÷': '/', '×': '*' };
        var sym = c;
        if (c === '-' && (prevKind === null || prevKind === 'op' || prevKind === '(' || prevKind === 'post')) {
          tok = { t: 'op', v: 'neg', unary: true }; kind = 'op';
        } else if (c === '+') {
          if (prevKind === null || prevKind === 'op' || prevKind === '(') { i++; continue; }
        }
        if (!tok) { tok = { t: 'op', v: map[sym] }; kind = 'op'; }
        i++;
      }
      else if (c === '(') { tok = { t: '(' }; kind = '('; i++; }
      else if (c === ')') { tok = { t: ')' }; kind = ')'; i++; }
      else if (POSTFIX[c]) { tok = { t: 'post', v: c }; kind = 'post'; i++; }
      else throw 'Syntax';

      var curIsValStart = (kind === 'num' || kind === 'const' || kind === 'func' || kind === '(');
      var prevIsValEnd = (prevKind === 'num' || prevKind === 'const' || prevKind === ')' || prevKind === 'post');
      if (curIsValStart && prevIsValEnd) {
        toks.push({ t: 'op', v: '*', implicit: true });
      }

      toks.push(tok);
      prevKind = kind;
    }
    return toks;
  }

  // ── SHUNTING YARD → RPN ──
  var PREC = { '+': 2, '-': 2, '*': 3, '/': 3, '^': 4, neg: 4.5 };
  var POSTPREC = 5.5;
  var RIGHTASSOC = { '^': true, neg: true };

  function toRPN(toks) {
    var out = [], ops = [];
    function top() { return ops[ops.length - 1]; }

    for (var i = 0; i < toks.length; i++) {
      var tk = toks[i];
      if (tk.t === 'num') { out.push(tk); continue; }
      if (tk.t === 'func') { ops.push(tk); continue; }
      if (tk.t === '(') { ops.push(tk); continue; }
      if (tk.t === ')') {
        while (ops.length && top().t !== '(') out.push(ops.pop());
        if (!ops.length) throw 'Syntax';
        ops.pop();
        if (ops.length && top().t === 'func') out.push(ops.pop());
        continue;
      }
      if (tk.t === 'post') {
        while (ops.length && top().t === 'post') out.push(ops.pop());
        ops.push(tk);
        continue;
      }
      var p = tk.unary ? PREC.neg : PREC[tk.v];
      while (ops.length) {
        var t1 = top();
        if (t1.t === 'op' || t1.t === 'post') {
          var p1 = t1.t === 'post' ? POSTPREC : (t1.unary ? PREC.neg : PREC[t1.v]);
          var right = tk.unary ? true : RIGHTASSOC[tk.v];
          if (p1 > p || (p1 === p && !right)) { out.push(ops.pop()); continue; }
        }
        break;
      }
      ops.push(tk);
    }
    while (ops.length) {
      var t2 = ops.pop();
      if (t2.t === '(') throw 'Syntax';
      out.push(t2);
    }
    return out;
  }

  // ── RPN EVAL ──
  function fact(x) {
    if (x < 0 || x % 1 !== 0) return NaN;
    if (x > 170) return Infinity;
    var r = 1;
    for (var i = 2; i <= x; i++) r *= i;
    return r;
  }

  function applyFunc(name, x) {
    var d = Math.PI / 180;
    switch (name) {
      case 'sin':   return Math.sin(deg ? x * d : x);
      case 'cos':   return Math.cos(deg ? x * d : x);
      case 'tan':   return Math.tan(deg ? x * d : x);
      case 'asin':  { var r = Math.asin(x); return deg ? r / d : r; }
      case 'acos':  { var r2 = Math.acos(x); return deg ? r2 / d : r2; }
      case 'atan':  { var r3 = Math.atan(x); return deg ? r3 / d : r3; }
      case 'sqrt':  return Math.sqrt(x);
      case 'ln':    return Math.log(x);
      case 'log':   return Math.log10(x);
      case 'exp':   return Math.exp(x);
      case 'tenpow':return Math.pow(10, x);
      case 'neg':   return -x;
    }
    throw 'Syntax';
  }

  function evalRPN(rpn) {
    var st = [];
    for (var i = 0; i < rpn.length; i++) {
      var tk = rpn[i];
      if (tk.t === 'num') { st.push(tk.v); continue; }
      if (tk.t === 'func') {
        if (!st.length) throw 'Syntax';
        st.push(applyFunc(tk.v, st.pop()));
        continue;
      }
      if (tk.t === 'post') {
        if (!st.length) throw 'Syntax';
        var a = st.pop();
        st.push(tk.v === '!' ? fact(a) : a / 100);
        continue;
      }
      if (tk.unary || tk.v === 'neg') {
        if (!st.length) throw 'Syntax';
        st.push(-st.pop());
        continue;
      }
      if (st.length < 2) throw 'Syntax';
      var b = st.pop(), a2 = st.pop();
      switch (tk.v) {
        case '+': st.push(a2 + b); break;
        case '-': st.push(a2 - b); break;
        case '*': st.push(a2 * b); break;
        case '/': st.push(a2 / b); break;
        case '^': st.push(Math.pow(a2, b)); break;
        default: throw 'Syntax';
      }
    }
    if (st.length !== 1) throw 'Syntax';
    return st[0];
  }

  function safeEval(src) {
    var open = 0;
    for (var i = 0; i < src.length; i++) {
      if (src[i] === '(') open++;
      else if (src[i] === ')') open--;
    }
    for (var j = 0; j < open; j++) src += ')';
    var toks = tokenize(src);
    if (!toks.length) throw 'Syntax';
    return evalRPN(toRPN(toks));
  }

  // ── FORMAT ──
  function fmt(x) {
    if (typeof x !== 'number' || isNaN(x)) return 'Error';
    if (!isFinite(x)) return x > 0 ? '∞' : '-∞';
    if (x === 0) return '0';
    var a = Math.abs(x);
    if (a >= 1e13 || a < 1e-9) return x.toExponential(6).replace(/e\+?/, 'e');
    return String(parseFloat(x.toPrecision(12)));
  }

  // ── DISPLAY ──
  function update() {
    dBig.classList.remove('err');
    if (mode === 'result') return;
    dBig.textContent = expr || '0';
    if (expr && /[\d.)π!%]$/.test(expr)) {
      try {
        var v = safeEval(expr);
        dSmall.textContent = '= ' + fmt(v);
      } catch (e) { dSmall.textContent = ''; }
    } else dSmall.textContent = '';
  }

  // ── SECRET ──
  function unlock() {
    unlocked = true;
    try { sessionStorage.setItem('lx_unlocked', '1'); } catch (e) {}
    secretDot.classList.add('on');
    showScreen('launcherScreen');
  }

  secretDot.addEventListener('click', function() {
    if (unlocked) showScreen('launcherScreen');
  });

  // ── INPUT ──
  var MULTI = ['asin(','acos(','atan(','tenpow(','sqrt(','sin(','cos(','tan(','log(','exp(','ln(','ans','π'];
  function backspace() {
    mode = 'input';
    for (var i = 0; i < MULTI.length; i++) {
      if (expr.endsWith(MULTI[i])) { expr = expr.slice(0, -MULTI[i].length); update(); return; }
    }
    expr = expr.slice(0, -1);
    update();
  }

  function insert(val) {
    var startsValue = /^[0-9.πe]/.test(val) || val === 'ans'
      || /(\(|$)/.test(val) && ['sin(','cos(','tan(','asin(','acos(','atan(','log(','ln(','exp(','tenpow(','√('].indexOf(val) >= 0;
    if (mode === 'result') {
      if (/^[0-9.]$/.test(val) || (startsValue && !/^[\^!%+÷×\-]$/.test(val))) {
        expr = '';
      } else {
        expr = fmt(lastResult);
      }
      mode = 'input';
    }
    expr += val;
    update();
  }

  function equals() {
    if (!expr) return;
    try {
      var v = safeEval(expr);
      if (v === SECRET || /^3396981$/.test(expr.trim())) {
        unlock();
        dSmall.textContent = expr + ' =';
        dBig.textContent = fmt(v);
        mode = 'result';
        lastResult = v; ans = v;
        return;
      }
      pushHistory(expr, v);
      dSmall.textContent = expr + ' =';
      lastResult = v; ans = v;
      dBig.textContent = fmt(v);
      mode = 'result';
    } catch (e) {
      dSmall.textContent = expr;
      dBig.textContent = 'Syntax Error';
      dBig.classList.add('err');
      mode = 'result';
      lastResult = 0;
    }
  }

  // ── HISTORY ──
  var hist = [];
  try { hist = JSON.parse(localStorage.getItem('calc_hist') || '[]'); } catch (e) { hist = []; }
  var histPanel = document.getElementById('histPanel');
  var histBtn = document.getElementById('histBtn');

  function pushHistory(e, r) {
    hist.unshift({ e: e, r: fmt(r) });
    if (hist.length > 30) hist.pop();
    try { localStorage.setItem('calc_hist', JSON.stringify(hist)); } catch (err) {}
    renderHist();
  }

  function renderHist() {
    if (!hist.length) {
      histPanel.innerHTML = '<div class="hempty">no calculations yet</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < hist.length; i++) {
      html += '<div class="hitem" data-i="' + i + '"><div class="he">' +
        String(hist[i].e).replace(/&/g,'&amp;').replace(/</g,'&lt;') +
        ' =</div><div class="hr">' + String(hist[i].r).replace(/</g,'&lt;') + '</div></div>';
    }
    histPanel.innerHTML = html;
    var items = histPanel.querySelectorAll('.hitem');
    for (var j = 0; j < items.length; j++) {
      (function(item) {
        item.addEventListener('click', function() {
          var idx = parseInt(item.getAttribute('data-i'));
          expr = hist[idx].e;
          mode = 'input';
          update();
        });
      })(items[j]);
    }
  }
  renderHist();

  histBtn.addEventListener('click', function() {
    histPanel.classList.toggle('open');
  });

  // ── 2ND / DEG ──
  var k2nd = document.getElementById('k2nd');
  var FN2 = {
    sin: ['asin(', 'sin⁻¹'], cos: ['acos(', 'cos⁻¹'], tan: ['atan(', 'tan⁻¹'],
    ln: ['exp(', 'eˣ'], log: ['tenpow(', '10ˣ'], sqrt: ['^2', 'x²']
  };

  k2nd.addEventListener('click', function() {
    second = !second;
    k2nd.classList.toggle('second-on', second);
    var fns = document.querySelectorAll('[data-fn]');
    for (var i = 0; i < fns.length; i++) {
      var name = fns[i].getAttribute('data-fn');
      if (FN2[name]) fns[i].textContent = second ? FN2[name][1] : fns[i].getAttribute('data-label');
    }
  });
  (function() {
    var fns = document.querySelectorAll('[data-fn]');
    for (var i = 0; i < fns.length; i++) fns[i].setAttribute('data-label', fns[i].textContent);
  })();

  document.getElementById('kDeg').addEventListener('click', function() {
    deg = !deg;
    flagDeg.textContent = deg ? 'DEG' : 'RAD';
    this.textContent = deg ? 'DEG' : 'RAD';
    mode = 'input'; update();
  });

  var fns = document.querySelectorAll('[data-fn]');
  for (var i = 0; i < fns.length; i++) {
    (function(btn) {
      var name = btn.getAttribute('data-fn');
      btn.addEventListener('click', function() {
        var ins;
        if (second && FN2[name]) {
          ins = FN2[name][0];
          if (name === 'sqrt') ins = '^2';
          second = false;
          k2nd.classList.remove('second-on');
          var all = document.querySelectorAll('[data-fn]');
          for (var j = 0; j < all.length; j++) {
            var nm = all[j].getAttribute('data-fn');
            if (FN2[nm]) all[j].textContent = all[j].getAttribute('data-label');
          }
        } else {
          ins = name === 'sqrt' ? '√(' : name + '(';
        }
        insert(ins);
      });
    })(fns[i]);
  }

  var insKeys = document.querySelectorAll('[data-ins]');
  for (var k = 0; k < insKeys.length; k++) {
    (function(btn) {
      var val = btn.getAttribute('data-ins');
      btn.addEventListener('click', function() { insert(val); });
    })(insKeys[k]);
  }

  document.getElementById('kC').addEventListener('click', function() {
    expr = ''; mode = 'input';
    dSmall.textContent = '';
    update();
  });
  document.getElementById('kBack').addEventListener('click', backspace);
  document.getElementById('kEq').addEventListener('click', equals);

  function curVal() {
    try { return safeEval(expr); } catch (e) { return lastResult; }
  }
  function saveMem() {
    try { localStorage.setItem('calc_mem', String(mem)); } catch (e) {}
    flagMem.style.display = mem !== 0 ? '' : 'none';
  }
  document.getElementById('kMPlus').addEventListener('click', function() { mem += curVal(); saveMem(); });
  document.getElementById('kMS').addEventListener('click', function() { mem = curVal(); saveMem(); });
  document.getElementById('kMR').addEventListener('click', function() { insert(String(mem)); });
  document.getElementById('kMC').addEventListener('click', function() { mem = 0; saveMem(); });

  document.getElementById('kNeg').addEventListener('click', function() {
    if (mode === 'result') { expr = '(-' + fmt(lastResult) + ')'; mode = 'input'; update(); return; }
    var m = expr.match(/(\d*\.?\d+)$/);
    if (m) {
      var start = expr.length - m[1].length;
      var before = expr.slice(0, start);
      if (/^\($/.test(before) && /-$/.test(before.slice(0, -1))) {
        expr = expr.slice(0, -m[1].length - 2) + m[1];
      } else {
        expr = before + '(-' + m[1] + ')';
      }
    } else {
      expr += '(-';
    }
    update();
  });

  document.addEventListener('keydown', function(e) {
    if (document.getElementById('calcScreen').classList.contains('active') !== true) return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    var key = e.key;
    if (/^[0-9]$/.test(key)) { insert(key); e.preventDefault(); }
    else if (key === '.') { insert('.'); e.preventDefault(); }
    else if (key === '+') { insert('+'); e.preventDefault(); }
    else if (key === '-') { insert('-'); e.preventDefault(); }
    else if (key === '*') { insert('×'); e.preventDefault(); }
    else if (key === '/') { insert('÷'); e.preventDefault(); }
    else if (key === '^') { insert('^'); e.preventDefault(); }
    else if (key === '%') { insert('%'); e.preventDefault(); }
    else if (key === '!') { insert('!'); e.preventDefault(); }
    else if (key === '(') { insert('('); e.preventDefault(); }
    else if (key === ')') { insert(')'); e.preventDefault(); }
    else if (key === 'Enter' || key === '=') { equals(); e.preventDefault(); }
    else if (key === 'Backspace') { backspace(); e.preventDefault(); }
    else if (key === 'Escape') { document.getElementById('kC').click(); e.preventDefault(); }
  });

  update();
})();

// ═════════════════════════════════════════════════════════
//  HTML LAUNCHER + SAVE SYSTEM
// ═════════════════════════════════════════════════════════
(function() {
  var DB_NAME = 'html_launcher_db';
  var STORE = 'files';
  var db = null;
  var files = [];
  var launchMode = 'blank';

  var PACK_MAGIC = 'LAUNCHPAD1';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function status(msg, cls) {
    var s = $('status'); s.textContent = msg; s.className = cls || '';
  }
  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(2) + ' MB';
  }
  function fmtDate(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
  }

  // ── IndexedDB ──
  function openDB() {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function() { req.result.createObjectStore(STORE, { keyPath: 'id' }); };
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  }
  function dbOp(mode, fn) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(STORE, mode);
      var store = tx.objectStore(STORE);
      var req = fn(store);
      tx.oncomplete = function() { resolve(req && req.result); };
      tx.onerror = function() { reject(tx.error); };
    });
  }

  // ── render ──
  function render() {
    var list = $('fileList');
    list.innerHTML = '';
    files.sort(function(a, b) { return b.date - a.date; });
    for (var i = 0; i < files.length; i++) {
      (function(f) {
        var card = document.createElement('div');
        card.className = 'filecard';
        card.innerHTML =
          '<div class="ficon">&lt;/&gt;</div>' +
          '<div class="fmeta"><div class="fname">' + esc(f.name) + '</div>' +
          '<div class="finfo">' + fmtSize(f.size) + ' &middot; added ' + fmtDate(f.date) + '</div></div>' +
          '<div class="fbtns"><button class="runbtn">RUN</button>' +
          '<button class="rembtn">REMOVE</button></div>';
        card.querySelector('.runbtn').addEventListener('click', function() { runFile(f); });
        card.querySelector('.rembtn').addEventListener('click', function() { removeFile(f); });
        list.appendChild(card);
      })(files[i]);
    }
    $('listCount').textContent = 'LIBRARY — ' + files.length + ' FILE' + (files.length === 1 ? '' : 'S');
    $('emptyMsg').style.display = files.length ? 'none' : '';
  }

  // ── add ──
  window.pickFile = function() { $('fileInput').click(); };

  $('fileInput').addEventListener('change', function() {
    addFiles(this.files);
    this.value = '';
  });

  function addFiles(fileList) {
    var valid = 0, skipped = 0, pending = fileList.length;
    if (!pending) return;
    Array.prototype.forEach.call(fileList, function(file) {
      var ok = /\.(html?|txt)$/i.test(file.name) || file.type === 'text/html';
      if (!ok) { skipped++; pending--; checkDone(); return; }
      var reader = new FileReader();
      reader.onload = function() {
        var rec = { id: Date.now() + Math.floor(Math.random() * 1000),
          name: file.name, size: file.size, date: Date.now(), html: reader.result };
        dbOp('readwrite', function(s) { return s.put(rec); }).then(function() {
          files.push(rec); valid++; pending--; checkDone();
        }).catch(function(e) {
          pending--; checkDone();
          status('storage failed: ' + (e && e.name || 'unknown'), 'err');
        });
      };
      reader.onerror = function() { pending--; checkDone(); };
      reader.readAsText(file);
    });
    function checkDone() {
      if (pending > 0) return;
      render();
      if (valid) status('added ' + valid + ' file' + (valid === 1 ? '' : 's') + ' — saved', 'ok');
      if (skipped) status('skipped ' + skipped + ' (not .html)', 'err');
    }
  }

  // drag & drop
  var addbox = $('addbox');
  ['dragenter', 'dragover'].forEach(function(ev) {
    addbox.addEventListener(ev, function(e) {
      e.preventDefault(); e.stopPropagation();
      addbox.classList.add('drag');
    });
  });
  ['dragleave', 'drop'].forEach(function(ev) {
    addbox.addEventListener(ev, function(e) {
      e.preventDefault(); e.stopPropagation();
      addbox.classList.remove('drag');
    });
  });
  addbox.addEventListener('drop', function(e) {
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ── remove ──
  function removeFile(f) {
    dbOp('readwrite', function(s) { return s.delete(f.id); }).then(function() {
      files = files.filter(function(x) { return x.id !== f.id; });
      render();
      status('removed "' + f.name + '"', 'ok');
    });
  }
  window.clearAll = function() {
    if (!files.length) return;
    if (!confirm('Remove ALL ' + files.length + ' files from the library?')) return;
    dbOp('readwrite', function(s) { return s.clear(); }).then(function() {
      files = [];
      render();
      status('library cleared', 'ok');
    });
  };

  // ═══════════════════════════════════════════
  //  SAVE SYSTEM — .launchpad export / import
  // ═══════════════════════════════════════════

  // EXPORT: bundle entire library -> single .launchpad file
  window.exportPack = function() {
    if (!files.length) { status('library is empty — nothing to save', 'err'); return; }

    var pack = {
      magic: PACK_MAGIC,
      exported: Date.now(),
      count: files.length,
      files: files.map(function(f) {
        return { name: f.name, size: f.size, html: f.html };
      })
    };

    var blob = new Blob([JSON.stringify(pack)], { type: 'application/octet-stream' });
    var url = URL.createObjectURL(blob);

    var d = new Date();
    var stamp = d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');

    var a = document.createElement('a');
    a.href = url;
    a.download = 'library-' + stamp + '-' + files.length + 'files.launchpad';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 5000);

    status('saved ' + files.length + ' file' + (files.length === 1 ? '' : 's') +
      ' → ' + a.download + ' (' + fmtSize(blob.size) + ')', 'ok');
  };

  // IMPORT: load .launchpad file -> restore all files
  window.importPack = function() { $('packInput').click(); };

  $('packInput').addEventListener('change', function() {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function() {
      var pack;
      try {
        pack = JSON.parse(reader.result);
      } catch (e) {
        status('invalid .launchpad file (not readable)', 'err');
        return;
      }

      // validate
      if (!pack || pack.magic !== PACK_MAGIC) {
        status('invalid .launchpad file (wrong format)', 'err');
        return;
      }
      if (!pack.files || !pack.files.length) {
        status('.launchpad file contains no files', 'err');
        return;
      }

      // dedupe: skip files that already exist (same name + same content)
      var existing = {};
      files.forEach(function(f) { existing[f.name + '|' + f.html.length] = true; });

      var added = 0, skipped = 0, pending = pack.files.length;

      pack.files.forEach(function(pf) {
        if (!pf.name || typeof pf.html !== 'string') { skipped++; pending--; checkImport(); return; }
        var key = pf.name + '|' + pf.html.length;
        if (existing[key]) { skipped++; pending--; checkImport(); return; }

        var rec = {
          id: Date.now() + Math.floor(Math.random() * 1000),
          name: pf.name,
          size: pf.html.length,
          date: Date.now(),
          html: pf.html
        };
        dbOp('readwrite', function(s) { return s.put(rec); }).then(function() {
          files.push(rec);
          added++;
          pending--;
          checkImport();
        }).catch(function(e) {
          skipped++;
          pending--;
          checkImport();
        });
      });

      function checkImport() {
        if (pending > 0) return;
        render();
        status('loaded ' + added + ' file' + (added === 1 ? '' : 's') +
          (skipped ? ' | skipped ' + skipped + ' (already in library)' : ''), 'ok');
      }
    };
    reader.onerror = function() {
      status('failed to read file', 'err');
    };
    reader.readAsText(file);
  });

  // ── run ──
  function injectCloak(html) {
    var title = $('titleInput').value.trim();
    var icon = $('iconInput').value.trim();
    var inject = '';
    if (title) inject += '<title>' + esc(title) + '</title>';
    if (icon) inject += '<link rel="icon" href="' + esc(icon) + '">';
    if (!inject) return html;
    if (/<head[^>]*>/i.test(html)) {
      return html.replace(/<head[^>]*>/i, function(m) { return m + inject; });
    }
    return inject + html;
  }

  function runFile(f) {
    var html = injectCloak(f.html);
    var win;
    if (launchMode === 'blank') {
      win = window.open('about:blank', '_blank');
      if (!win) { status('popup blocked — allow popups and press RUN again', 'err'); return; }
      win.document.open();
      win.document.write(html);
      win.document.close();
      status('running "' + f.name + '" in about:blank tab', 'ok');
    } else {
      var blob = new Blob([html], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      win = window.open(url, '_blank');
      if (!win) { status('popup blocked — allow popups and press RUN again', 'err'); return; }
      status('running "' + f.name + '" as blob: tab', 'ok');
      setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
    }
    if ($('fullscreenChk').checked && win) {
      try {
        var t = win.document && win.document.documentElement;
        if (t && t.requestFullscreen) t.requestFullscreen().catch(function() {});
      } catch (e) {}
    }
  }

  // ── config ──
  window.toggleSettings = function() { $('settings').classList.toggle('open'); };
  window.setMode = function(mode) {
    launchMode = mode;
    $('modeBlank').classList.toggle('active', mode === 'blank');
    $('modeBlob').classList.toggle('active', mode === 'blob');
    try { localStorage.setItem('lx_mode', mode); } catch (e) {}
  };
  window.selfCloak = function() {
    var title = $('titleInput').value.trim();
    if (title) document.title = title;
    status('tab cloaked' + (title ? ' -> ' + title : ''), 'ok');
  };

  document.getElementById('lockBtn').addEventListener('click', function() {
    showScreen('calcScreen');
  });

  // ── init ──
  openDB().then(function(database) {
    db = database;
    return dbOp('readonly', function(s) { return s.getAll(); });
  }).then(function(recs) {
    files = recs || [];
    render();
  }).catch(function(e) {
    status('storage unavailable — session only', 'err');
  });

  try {
    var m = localStorage.getItem('lx_mode');
    if (m === 'blob' || m === 'blank') launchMode = m;
  } catch (e) {}
  window.setMode(launchMode);
})();
</script>
