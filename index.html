<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calculator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #06080d; color: #d8e4ff; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
  .screen {
    position: fixed; inset: 0; overflow-y: auto;
    display: flex; align-items: center; justify-content: center; padding: 12px;
    opacity: 0; pointer-events: none; transform: scale(.985);
    transition: opacity .25s ease, transform .25s ease;
  }
  .screen.active { opacity: 1; pointer-events: auto; transform: scale(1); }
  .calc {
    width: 100%; max-width: 296px; user-select: none;
    background: #0a0e18; border: 2px solid #1e3a5f; border-radius: 16px;
    padding: 12px 10px 14px;
    box-shadow: 0 0 0 1px #0a1526, 0 14px 40px rgba(0,0,0,.6);
  }
  .brandrow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; }
  .brand { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #4a7ec2; text-transform: uppercase; }
  .histbtn { background: none; border: none; color: #34558a; font-size: 10px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
  .histbtn:hover { color: #6ea8ff; }
  .display {
    position: relative; background: #070b14; border: 1px solid #16305a; border-radius: 10px;
    padding: 12px 12px 10px; margin-bottom: 10px; text-align: right;
  }
  .d-small { min-height: 14px; font-size: 11px; color: #4a6a99; font-family: Consolas, monospace; word-break: break-all; overflow-x: auto; white-space: nowrap; }
  .d-big {
    font-size: 26px; font-weight: 300; margin-top: 2px; font-family: Consolas, monospace;
    word-break: break-all; overflow-x: auto; white-space: nowrap; line-height: 1.15;
    color: #e8f1ff; text-shadow: 0 0 12px rgba(74,158,255,.25);
  }
  .d-big.err { color: #ff6b8a; font-size: 16px; text-shadow: none; }
  .d-flags { position: absolute; top: 6px; left: 10px; font-size: 9px; color: #34558a; font-weight: 700; letter-spacing: 1px; display: flex; gap: 6px; }
  #secretDot { position: absolute; top: 7px; right: 10px; width: 6px; height: 6px; border-radius: 50%; background: #1a2c4a; cursor: pointer; display: none; }
  #secretDot.on { display: block; }
  #secretDot:hover { background: #4a9eff; }
  .histpanel { display: none; background: #070b14; border: 1px solid #14264a; border-radius: 8px; margin-bottom: 10px; padding: 4px; max-height: 150px; overflow-y: auto; }
  .histpanel.open { display: block; }
  .hitem { padding: 6px 8px; border-radius: 5px; cursor: pointer; font-family: Consolas, monospace; font-size: 11px; }
  .hitem:hover { background: #0d1626; }
  .hitem .he { color: #3a5a8a; word-break: break-all; }
  .hitem .hr { color: #cfe1ff; font-size: 12px; }
  .hempty { color: #22344f; font-size: 10px; text-align: center; padding: 10px; }
  .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .k {
    height: 44px; border: 1px solid #14264a; border-radius: 9px; cursor: pointer;
    font-size: 15px; font-weight: 600; color: #d8e4ff; background: #101a30;
    transition: background .1s, transform .05s; font-family: inherit;
  }
  .k:active { transform: scale(.92); }
  .k.fn { background: #0c1526; color: #5a86c2; font-size: 12px; border-color: #12223f; }
  .k.fn:hover { background: #12203a; color: #8ab8ff; }
  .k.op { background: #14264a; color: #6ea8ff; font-size: 17px; border-color: #1d3660; }
  .k.op:hover { background: #1a3055; }
  .k.num { background: #131f38; font-size: 17px; border-color: #1a2c4f; }
  .k.num:hover { background: #1a2a48; }
  .k.util { background: #0c1526; color: #4a6a99; font-size: 12px; border-color: #12223f; }
  .k.util:hover { background: #12203a; color: #7aa0d8; }
  .k.eq { grid-column: span 2; background: #1d5fd6; color: #fff; font-size: 18px; border-color: #2b6fe0; }
  .k.eq:hover { background: #2b6fe0; }
  .k.second-on { background: #1a3a6a !important; color: #6ea8ff !important; border-color: #2a4a80 !important; }
  .wrap { width: 100%; max-width: 560px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 20px; letter-spacing: 1px; color: #e8f1ff; }
  h1 span { color: #4a9eff; }
  .storebtn { background: #0c1526; border: 1px solid #1e3a5f; color: #8ab8ff; border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .storebtn:hover { background: #12203a; color: #cfe1ff; }
  .lockbtn { background: none; border: none; color: #22344f; font-size: 20px; cursor: pointer; line-height: 1; padding: 0 10px 0 0; }
  .lockbtn:hover { color: #4a9eff; }
  .hgroup { display: flex; gap: 8px; }
  .addbox {
    background: #0a0e18; border: 2px dashed #1e3a5f; border-radius: 10px;
    padding: 26px 16px; text-align: center; margin-bottom: 14px; cursor: pointer; transition: border-color .15s;
  }
  .addbox:hover, .addbox.drag { border-color: #4a9eff; }
  .addbox .big { font-size: 26px; line-height: 1; margin-bottom: 8px; color: #4a9eff; }
  .addbox .t1 { font-size: 14px; font-weight: 600; color: #cfe1ff; }
  .addbox .t2 { font-size: 11px; color: #3a5a8a; margin-top: 4px; }
  .listhead { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 8px; }
  .listhead span { font-size: 11px; color: #3a5a8a; letter-spacing: 1px; font-weight: 600; }
  .clearall { background: none; border: none; color: #ff6b8a; font-size: 11px; cursor: pointer; }
  .filecard {
    background: #0a0e18; border: 1px solid #16305a; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
  }
  .ficon { width: 38px; height: 38px; flex-shrink: 0; border-radius: 8px; background: #0c1526; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #4a9eff; font-weight: 700; }
  .fmeta { flex: 1; min-width: 0; }
  .fname { font-size: 13px; font-weight: 600; color: #e8f1ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .finfo { font-size: 10px; color: #3a5a8a; margin-top: 3px; font-family: Consolas, monospace; }
  .fbtns { display: flex; gap: 6px; flex-shrink: 0; }
  .runbtn { background: #1d5fd6; color: #fff; border: none; border-radius: 6px; padding: 9px 18px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .runbtn:hover { background: #2b6fe0; }
  .rembtn { background: #0c1526; color: #ff6b8a; border: 1px solid #3a2540; border-radius: 6px; padding: 9px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .rembtn:hover { background: #1a1520; }
  .empty { text-align: center; color: #22344f; font-size: 12px; padding: 30px 0; }
  .packrow { display: flex; gap: 8px; margin-bottom: 8px; }
  .packbtn { flex: 1; padding: 11px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: .5px; background: #0c1e30; color: #4adeff; border: 1px solid #16455a; }
  .packbtn:hover { background: #12283f; }
  .packbtn.red { background: #1a1526; color: #b08aff; border: 1px solid #34285a; }
  .packbtn.red:hover { background: #241c38; }
  .settings { background: #0a0e18; border: 1px solid #16305a; border-radius: 10px; padding: 14px; margin-top: 14px; display: none; }
  .settings.open { display: block; }
  .settings h2 { font-size: 11px; color: #4a6a99; letter-spacing: 1px; margin-bottom: 10px; }
  .setrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .setrow label { font-size: 12px; color: #8ab8ff; }
  .setrow .hint { font-size: 10px; color: #34558a; display: block; margin-top: 2px; }
  .seg { display: flex; gap: 4px; flex-shrink: 0; }
  .seg button { background: #0c1526; border: 1px solid #16305a; color: #5a86c2; border-radius: 4px; padding: 7px 12px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .seg button.active { background: #14264a; color: #fff; border-color: #2a4a80; }
  .cloakrow { display: flex; gap: 6px; margin-bottom: 10px; }
  .cloakrow input { flex: 1; background: #070b14; border: 1px solid #16305a; color: #d8e4ff; border-radius: 4px; padding: 9px; font-size: 12px; outline: none; }
  .checkrow { display: flex; gap: 16px; font-size: 12px; color: #4a6a99; }
  .checkrow input { accent-color: #4a9eff; }
  .fullbtn { width: 100%; background: #0c1526; color: #8ab8ff; border: 1px solid #1e3a5f; border-radius: 6px; padding: 10px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .fullbtn:hover { background: #12203a; color: #cfe1ff; }
  #status { margin-top: 12px; font-size: 11px; color: #3a5a8a; font-family: Consolas, monospace; min-height: 14px; word-break: break-all; }
  #status.ok { color: #4adeff; }
  #status.err { color: #ff6b8a; }
</style>
</head>
<body>

</div>

<div id="launcherScreen" class="screen">
  <div class="wrap">
    <header>
      <h1>HTML <span>LAUNCHER</span></h1>
      <div class="hgroup">
        <button class="lockbtn" id="lockBtn">•</button>
        <button class="storebtn" onclick="toggleSettings()">CONFIG</button>
      </div>
    </header>
    <div class="addbox" id="addbox" onclick="pickFile()">
      <div class="big">+</div>
      <div class="t1">Add HTML files</div>
      <div class="t2">tap to browse or drop files here — saved permanently</div>
    </div>
    <input type="file" id="fileInput" accept=".html,.htm,text/html" multiple style="display:none">
    <div class="packrow">
      <button class="packbtn" onclick="exportPack()">💾 SAVE LIBRARY (.launchpad)</button>
      <button class="packbtn red" onclick="importPack()">📂 LOAD .launchpad</button>
    </div>
    <input type="file" id="packInput" accept=".launchpad" style="display:none">
    <div class="listhead">
      <span id="listCount">LIBRARY — 0 FILES</span>
      <button class="clearall" onclick="clearAll()">REMOVE ALL</button>

          <label>Launch method</label>

        </div>

        <label><input type="checkbox" id="fullscreenChk"> fullscreen launched tab</label>
      </div>
      <button class="fullbtn" onclick="selfCloak()">CLOAK THIS TAB</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<script>
function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

// ═══════════ CALCULATOR ═══════════
(function() {
  var SECRET = 3396981;
  var expr = '', mode = 'input', lastResult = 0, ans = 0, mem = 0, deg = true, second = false, unlocked = false;

  var dSmall = document.getElementById('dSmall');
  var dBig = document.getElementById('dBig');
  var flagDeg = document.getElementById('flagDeg');
  var flagMem = document.getElementById('flagMem');
  var secretDot = document.getElementById('secretDot');

  try { mem = parseFloat(localStorage.getItem('calc_mem')) || 0; } catch (e) {}
  try { unlocked = sessionStorage.getItem('lx_unlocked') === '1'; } catch (e) {}
  if (unlocked) secretDot.classList.add('on');
  if (mem !== 0) flagMem.style.display = '';

  var OPCHARS = '+-*/^÷×';
  var OPMAP = { '+': '+', '-': '-', '*': '*', '/': '/', '^': '^', '÷': '/', '×': '*' };
  var FUNCS = ['asin','acos','atan','tenpow','sqrt','sin','cos','tan','log','exp','ln','ans','neg'];
  var POSTFIX = { '!': true, '%': true };

  function tokenize(src) {
    var toks = [];
    var i = 0, n = src.length;
    var prevKind = null;
    function isDigit(c) { return c >= '0' && c <= '9'; }
    function isLetter(c) { return (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z'); }
    while (i < n) {
      var c = src[i];
      if (c === ' ') { i++; continue; }
      var kind = null, tok = null;
      if (isDigit(c) || (c === '.' && isDigit(src.charAt(i + 1)))) {
        var j = i;
        while (j < n && (isDigit(src[j]) || src[j] === '.')) j++;
        tok = { t: 'num', v: parseFloat(src.slice(i, j)) };
        kind = 'num'; i = j;
      } else if (isLetter(c)) {
        var matched = null, mLen = 0;
        var rest = src.slice(i).toLowerCase();
        for (var f = 0; f < FUNCS.length; f++) {
          var fn = FUNCS[f];
          if (rest.indexOf(fn) === 0 && fn.length > mLen) { matched = fn; mLen = fn.length; }
        }
        if (!matched && c.toLowerCase() === 'e') { matched = 'e'; mLen = 1; }
        if (!matched) throw 'Syntax';
        if (matched === 'e') { tok = { t: 'num', v: Math.E }; kind = 'const'; }
        else if (matched === 'ans') { tok = { t: 'num', v: ans }; kind = 'const'; }
        else { tok = { t: 'func', v: matched }; kind = 'func'; }
        i += mLen;
      } else if (c === 'π') { tok = { t: 'num', v: Math.PI }; kind = 'const'; i++; }
      else if (c === '√') { tok = { t: 'func', v: 'sqrt' }; kind = 'func'; i++; }
      else if (OPCHARS.indexOf(c) >= 0) {
        if (c === '-' && (prevKind === null || prevKind === 'op' || prevKind === '(' || prevKind === 'post')) {
          tok = { t: 'op', v: 'neg', unary: true }; kind = 'op';
        } else if (c === '+' && (prevKind === null || prevKind === 'op' || prevKind === '(')) {
          i++; continue;
        } else { tok = { t: 'op', v: OPMAP[c] }; kind = 'op'; }
        i++;
      } else if (c === '(') { tok = { t: '(' }; kind = '('; i++; }
      else if (c === ')') { tok = { t: ')' }; kind = ')'; i++; }
      else if (POSTFIX[c]) { tok = { t: 'post', v: c }; kind = 'post'; i++; }
      else throw 'Syntax';
      var curVal = (kind === 'num' || kind === 'const' || kind === 'func' || kind === '(');
      var prevVal = (prevKind === 'num' || prevKind === 'const' || prevKind === ')' || prevKind === 'post');
      if (curVal && prevVal) toks.push({ t: 'op', v: '*', implicit: true });
      toks.push(tok);
      prevKind = kind;
    }
    return toks;
  }

  var PREC = { '+': 2, '-': 2, '*': 3, '/': 3, '^': 4, neg: 4.5 };
  var POSTPREC = 5.5;
  var RIGHTASSOC = { '^': true, neg: true };

  function toRPN(toks) {
    var out = [], ops = [];
    function top() { return ops[ops.length - 1]; }
    for (var i = 0; i < toks.length; i++) {
      var tk = toks[i];
      if (tk.t === 'num') { out.push(tk); continue; }
      if (tk.t === 'func') { ops.push(tk); continue; }
      if (tk.t === '(') { ops.push(tk); continue; }
      if (tk.t === ')') {
        while (ops.length && top().t !== '(') out.push(ops.pop());
        if (!ops.length) throw 'Syntax';
        ops.pop();
        if (ops.length && top().t === 'func') out.push(ops.pop());
        continue;
      }
      if (tk.t === 'post') {
        while (ops.length && top().t === 'post') out.push(ops.pop());
        ops.push(tk);
        continue;
      }
      var p = tk.unary ? PREC.neg : PREC[tk.v];
      while (ops.length) {
        var t1 = top();
        if (t1.t === 'op' || t1.t === 'post') {
          var p1 = (t1.t === 'post') ? POSTPREC : (t1.unary ? PREC.neg : PREC[t1.v]);
          var ra = tk.unary ? true : !!RIGHTASSOC[tk.v];
          if (p1 > p || (p1 === p && !ra)) { out.push(ops.pop()); continue; }
        }
        break;
      }
      ops.push(tk);
    }
    while (ops.length) {
      var t2 = ops.pop();
      if (t2.t === '(') throw 'Syntax';
      out.push(t2);
    }
    return out;
  }

  function fact(x) {
    if (x < 0 || x % 1 !== 0) return NaN;
    if (x > 170) return Infinity;
    var r = 1;
    for (var i = 2; i <= x; i++) r *= i;
    return r;
  }

  function applyFunc(name, x) {
    var d = Math.PI / 180;
    switch (name) {
      case 'sin': return Math.sin(deg ? x * d : x);
      case 'cos': return Math.cos(deg ? x * d : x);
      case 'tan': return Math.tan(deg ? x * d : x);
      case 'asin': var r = Math.asin(x); return deg ? r / d : r;
      case 'acos': var r2 = Math.acos(x); return deg ? r2 / d : r2;
      case 'atan': var r3 = Math.atan(x); return deg ? r3 / d : r3;
      case 'sqrt': return Math.sqrt(x);
      case 'ln': return Math.log(x);
      case 'log': return Math.log10(x);
      case 'exp': return Math.exp(x);
      case 'tenpow': return Math.pow(10, x);
      case 'neg': return -x;
    }
    throw 'Syntax';
  }

  function evalRPN(rpn) {
    var st = [];
    for (var i = 0; i < rpn.length; i++) {
      var tk = rpn[i];
      if (tk.t === 'num') { st.push(tk.v); continue; }
      if (tk.t === 'func') { if (!st.length) throw 'Syntax'; st.push(applyFunc(tk.v, st.pop())); continue; }
      if (tk.t === 'post') {
        if (!st.length) throw 'Syntax';
        var a = st.pop();
        st.push(tk.v === '!' ? fact(a) : a / 100);
        continue;
      }
      if (tk.unary || tk.v === 'neg') { if (!st.length) throw 'Syntax'; st.push(-st.pop()); continue; }
      if (st.length < 2) throw 'Syntax';
      var b = st.pop(), a2 = st.pop();
      switch (tk.v) {
        case '+': st.push(a2 + b); break;
        case '-': st.push(a2 - b); break;
        case '*': st.push(a2 * b); break;
        case '/': st.push(a2 / b); break;
        case '^': st.push(Math.pow(a2, b)); break;
        default: throw 'Syntax';
      }
    }
    if (st.length !== 1) throw 'Syntax';
    return st[0];
  }

  function safeEval(src) {
    var open = 0;
    for (var i = 0; i < src.length; i++) {
      if (src[i] === '(') open++;
      else if (src[i] === ')') open--;
    }

    if (!toks.length) throw 'Syntax';
    return evalRPN(toRPN(toks));
  }

  function fmt(x) {
    if (typeof x !== 'number' || isNaN(x)) return 'Error';
    if (!isFinite(x)) return x > 0 ? '∞' : '-∞';
    if (x === 0) return '0';
    var a = Math.abs(x);
    if (a >= 1e13 || a < 1e-9) return x.toExponential(6).replace(/e\+?/, 'e');
    return String(parseFloat(x.toPrecision(12)));
  }

  function update() {
    dBig.classList.remove('err');
    if (mode === 'result') return;
    dBig.textContent = expr || '0';
    if (expr && /[\d.)π!%]$/.test(expr)) {
      try { dSmall.textContent = '= ' + fmt(safeEval(expr)); }
      catch (e) { dSmall.textContent = ''; }
    } else dSmall.textContent = '';
  }

  function unlock() {
    unlocked = true;
    try { sessionStorage.setItem('lx_unlocked', '1'); } catch (e) {}
    secretDot.classList.add('on');
    showScreen('launcherScreen');
  }

  secretDot.addEventListener('click', function() { if (unlocked) showScreen('launcherScreen'); });

  var MULTI = ['asin(','acos(','atan(','tenpow(','sqrt(','sin(','cos(','tan(','log(','exp(','ln(','ans','π'];
  function backspace() {
    mode = 'input';
    for (var i = 0; i < MULTI.length; i++) {
      if (expr.indexOf(MULTI[i], expr.length - MULTI[i].length) !== -1) {
        expr = expr.slice(0, -MULTI[i].length); update(); return;
      }
    }
    expr = expr.slice(0, -1);
    update();
  }

  var FUNCS_INSERT = ['sin(','cos(','tan(','asin(','acos(','atan(','log(','ln(','exp(','tenpow(','√('];
  function insert(val) {
    var startsValue = /^[0-9.πe]/.test(val) || val === 'ans' || FUNCS_INSERT.indexOf(val) >= 0;
    if (mode === 'result') {
      if (/^[0-9.]$/.test(val) || (startsValue && !/^[\^!%+÷×\-]$/.test(val))) {
        expr = '';
      } else {
        expr = fmt(lastResult);
        if (expr === 'Error' || expr === '∞' || expr === '-∞') expr = '0';
      }
      mode = 'input';
    }
    expr += val;
    update();
  }

  function equals() {
    if (!expr) return;
    try {
      var v = safeEval(expr);
      if (v === SECRET || /^3396981$/.test(expr.trim())) {
        unlock();
        dSmall.textContent = expr + ' =';
        dBig.textContent = fmt(v);
        mode = 'result'; lastResult = v; ans = v;
        return;
      }
      pushHistory(expr, v);
      dSmall.textContent = expr + ' =';
      lastResult = v; ans = v;
      dBig.textContent = fmt(v);
      mode = 'result';
    } catch (e) {
      dSmall.textContent = expr;
      dBig.textContent = 'Syntax Error';

      mode = 'result'; lastResult = 0;

  var hist = [];
  try { hist = JSON.parse(localStorage.getItem('calc_hist') || '[]'); } catch (e) { hist = []; }
  var histPanel = document.getElementById('histPanel');

  function pushHistory(e, r) {

    renderHist();
  }

  function renderHist() {

    var html = '';
    for (var i = 0; i < hist.length; i++) {
      html += '<div class="hitem" data-i="' + i + '"><div class="he">' +
        String(hist[i].e).replace(/&/g,'&amp;').replace(/</g,'&lt;') +

    }

    var items = histPanel.querySelectorAll('.hitem');
    for (var j = 0; j < items.length; j++) {
      (function(item) {

          expr = hist[parseInt(item.getAttribute('data-i'))].e;

        });
      })(items[j]);

  renderHist();
  document.getElementById('histBtn').addEventListener('click', function() { histPanel.classList.toggle('open'); });

  var k2nd = document.getElementById('k2nd');
  var FN2 = {
    sin: ['asin(', 'sin⁻¹'], cos: ['acos(', 'cos⁻¹'], tan: ['atan(', 'tan⁻¹'],
    ln: ['exp(', 'eˣ'], log: ['tenpow(', '10ˣ'], sqrt: ['^2', 'x²']

  k2nd.addEventListener('click', function() {

    var fns = document.querySelectorAll('[data-fn]');
    for (var i = 0; i < fns.length; i++) {
      var name = fns[i].getAttribute('data-fn');
      if (FN2[name]) fns[i].textContent = second ? FN2[name][1] : fns[i].getAttribute('data-label');
    }
  });
  (function() {
    var fns = document.querySelectorAll('[data-fn]');

  })();

  document.getElementById('kDeg').addEventListener('click', function() {

  });

  var fns = document.querySelectorAll('[data-fn]');
  for (var i = 0; i < fns.length; i++) {
    (function(btn) {
      var name = btn.getAttribute('data-fn');
      btn.addEventListener('click', function() {

        if (second && FN2[name]) {
          ins = FN2[name][0];

          k2nd.classList.remove('second-on');
          var all = document.querySelectorAll('[data-fn]');
          for (var j = 0; j < all.length; j++) {
            var nm = all[j].getAttribute('data-fn');
            if (FN2[nm]) all[j].textContent = all[j].getAttribute('data-label');

  document.getElementById('kBack').addEventListener('click', backspace);
  document.getElementById('kEq').addEventListener('click', equals);

    if (mode === 'result') { expr = '(-' + fmt(lastResult) + ')'; mode = 'input'; update(); return; }
    var m = expr.match(/(\d*\.?\d+)$/);
    if (m) {
      var start = expr.length - m[1].length;
      var before = expr.slice(0, start);
      if (before.length >= 2 && before.charAt(before.length - 1) === '(' && before.charAt(before.length - 2) === '-') {
        expr = expr.slice(0, start - 2) + m[1];
      } else {
        expr = before + '(-' + m[1] + ')';

  });

  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('calcScreen').classList.contains('active')) return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    var key = e.key;
    if (/^[0-9]$/.test(key)) { insert(key); e.preventDefault(); }
    else if (key === '.') { insert('.'); e.preventDefault(); }
    else if (key === '+') { insert('+'); e.preventDefault(); }
    else if (key === '-') { insert('-'); e.preventDefault(); }
    else if (key === '*') { insert('×'); e.preventDefault(); }
    else if (key === '/') { insert('÷'); e.preventDefault(); }
    else if (key === '^') { insert('^'); e.preventDefault(); }
    else if (key === '%') { insert('%'); e.preventDefault(); }
    else if (key === '!') { insert('!'); e.preventDefault(); }
    else if (key === '(') { insert('('); e.preventDefault(); }
    else if (key === ')') { insert(')'); e.preventDefault(); }
    else if (key === 'Enter' || key === '=') { equals(); e.preventDefault(); }
    else if (key === 'Backspace') { backspace(); e.preventDefault(); }
    else if (key === 'Escape') { document.getElementById('kC').click(); e.preventDefault(); }
  });

  update();
})();

// ═════════════════════════════════════════════════════════
//  LAUNCHER + .LAUNCHPAD v4 — BINARY BLOB EXTRACTION
//
//  WHY v4: a 22MB WASM bundle is ~90% one base64 string.
//  deflate can't squeeze base64 of binary (looks random),
//  and base64 itself costs +33% vs raw bytes.
//  FIX: decode every large base64 payload to RAW BINARY,
//  store as separate segments, deflate the rest.
//  - data:...;base64,XXX payloads >= 256 chars: extracted
//  - standalone giant base64 runs >= 16384 chars: extracted
//  - every extraction verified by exact roundtrip
//    (decode -> re-encode === original) so nothing breaks
//
//  Formats written: LPZ4 (deflate-raw) | LPL4 (LZ fallback)
//  Formats read: LPZ4, LPL4, LPZ3, LPZ2, LPL2, LPZ1, LPL1,
//                LAUNCHPAD1 (plain JSON)
// ═════════════════════════════════════════════════════════
(function() {
  var DB_NAME = 'html_launcher_db';
  var STORE = 'files';
  var db = null;
  var files = [];
  var launchMode = 'blank';

  var MAGIC_RAW4 = 'LPZ4';
  var MAGIC_LZ4  = 'LPL4';
  var MAGIC_RAW3 = 'LPZ3';
  var MAGIC_GZ2  = 'LPZ2';
  var MAGIC_LZ2  = 'LPL2';
  var MAGIC_GZ1  = 'LPZ1';
  var MAGIC_LZ1  = 'LPL1';
  var MAGIC_JSON = 'LAUNCHPAD1';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function status(msg, cls) {
    var s = $('status'); s.textContent = msg; s.className = cls || '';
  }
  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(2) + ' MB';
  }
  function fmtDate(ts) {
    var d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
  }

  function openDB() {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function() { req.result.createObjectStore(STORE, { keyPath: 'id' }); };
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  }
  function dbOp(m, fn) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(STORE, m);
      var req = fn(tx.objectStore(STORE));
      tx.oncomplete = function() { resolve(req && req.result); };
      tx.onerror = function() { reject(tx.error); };
    });
  }

  var TE = (typeof TextEncoder !== 'undefined') ? new TextEncoder() : null;
  var TD = (typeof TextDecoder !== 'undefined') ? new TextDecoder() : null;
  function textToBytes(str) {
    if (TE) return TE.encode(str);
    var arr = new Uint8Array(str.length);
    for (var i = 0; i < str.length; i++) arr[i] = str.charCodeAt(i) & 0xFF;
    return arr;
  }
  function bytesToText(bytes) {
    if (TD) return TD.decode(bytes);
    var str = '';
    for (var i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
    return str;
  }
  function concatBytes(a, b) {
    var out = new Uint8Array(a.length + b.length);
    out.set(a, 0); out.set(b, a.length);
    return out;
  }
  function u32ToBytes(n) {
    return new Uint8Array([(n >>> 24) & 0xFF, (n >>> 16) & 0xFF, (n >>> 8) & 0xFF, n & 0xFF]);
  }
  function bytesToU32(b, o) {
    return ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
  }
  function u16ToBytes(n) { return new Uint8Array([(n >> 8) & 0xFF, n & 0xFF]); }

  // ═══ BASE64 <-> BINARY ═══
  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function bytesToB64(bytes) {
    var CH = 0x8000;
    var parts = [];
    for (var i = 0; i < bytes.length; i += CH) {
      parts.push(String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CH, bytes.length))));
    }
    return btoa(parts.join(''));
  }

  // ═══ BINARY BLOB EXTRACTION ═══
  // manual scanner (fast on multi-MB strings — a regex with a
  // 16K+ quantifier would backtrack into next week).
  // finds maximal runs of base64 charset; a run is extracted
  // when it is a data-URI payload (>=256, preceded by base64,)
  // or a standalone giant blob (>=16384) — and ONLY when
  // decode -> re-encode matches the original exactly, so the
  // file is guaranteed to rebuild byte-identical on import.
  function extractBinaries(html) {
    var segs = [];
    var binCount = 0, binTotal = 0;
    var n = html.length;
    var i = 0;
    var textStart = 0;

    function isB64(c) {
      return (c >= 65 && c <= 90) || (c >= 97 && c <= 122) ||
             (c >= 48 && c <= 57) || c === 43 || c === 47;
    }

    while (i < n) {
      if (isB64(html.charCodeAt(i))) {
        var runStart = i;
        while (i < n && isB64(html.charCodeAt(i))) i++;
        var runLen = i - runStart;
        var padLen = 0;
        while (padLen < 2 && i + padLen < n && html.charCodeAt(i + padLen) === 61) padLen++;
        var fullLen = runLen + padLen;

        var candidate = false;
        if (fullLen % 4 === 0) {
          if (runLen >= 256 && runStart >= 7 &&
              html.substr(runStart - 7, 7) === 'base64,') {
            candidate = true; // data URI payload
          } else if (runLen >= 16384) {
            candidate = true; // standalone giant blob in JS
          }
        }

        if (candidate) {
          var payload = html.slice(runStart, runStart + fullLen);
          var bytes = null;
          try { bytes = b64ToBytes(payload); } catch (e) { bytes = null; }
          // exact roundtrip required — guarantees lossless rebuild
          if (bytes && bytes.length >= 192 && bytesToB64(bytes) === payload) {
            if (runStart > textStart) segs.push({ t: 0, d: html.slice(textStart, runStart) });
            segs.push({ t: 1, d: bytes });
            binCount++;
            binTotal += bytes.length;
            textStart = runStart + fullLen;
          }
        }
        i = runStart + fullLen;
      } else {
        i++;
      }
    }
    if (textStart < n) segs.push({ t: 0, d: html.slice(textStart) });
    return { segs: segs, binCount: binCount, binTotal: binTotal };
  }

  // ═══ REGION-AWARE TEXT MINIFIER (text portions only) ═══
  function minifyNormal(text) {
    text = text.replace(/<!--[\s\S]*?-->/g, '');
    var lines = text.split('\n');
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].replace(/\s+$/, '').replace(/^[ \t]+/, '');
      if (line === '') continue;
      out.push(line);
    }
    text = out.join('\n');
    text = text.replace(/>\s*\n\s*</g, '><');
    return text;
  }

  function minifyCSSInner(css) {
    css = css.replace(/\/\*[\s\S]*?\*\//g, '');
    css = css.replace(/\s+/g, ' ');
    css = css.replace(/\s*([{};:,>])\s*/g, '$1');
    css = css.replace(/;}/g, '}');
    return css.trim();
  }

  function preprocessHTML(src) {
    if (typeof src !== 'string' || src.length < 64) return src;
    var openTag = /<(script|pre|textarea|style)\b[^>]*>/gi;
    var regions = [];
    var last = 0, m;
    while ((m = openTag.exec(src)) !== null) {
      var tag = m[1].toLowerCase();
      var after = m.index + m[0].length;
      var closeRe = new RegExp('</' + tag + '\\s*>', 'i');
      var rest = src.slice(after);
      var cm = rest.search(closeRe);
      var end;
      if (cm === -1) end = src.length;
      else end = after + cm + rest.slice(cm).match(closeRe)[0].length;
      if (m.index > last) regions.push({ t: 'n', s: last, e: m.index });
      regions.push({ t: tag, s: m.index, e: end });
      last = end;
      openTag.lastIndex = end;
    }
    regions.push({ t: 'n', s: last, e: src.length });

    var outp = [];
    for (var r = 0; r < regions.length; r++) {
      var reg = regions[r];
      var text = src.slice(reg.s, reg.e);
      if (reg.t === 'n') {
        outp.push(minifyNormal(text));
      } else if (reg.t === 'style') {
        var openM = text.match(/^<style\b[^>]*>/i);
        var closeM = text.match(/<\/style\s*>/i);
        var inner = text.slice(
          openM ? openM[0].length : 0,
          closeM ? text.length - closeM[0].length : text.length);
        outp.push((openM ? openM[0] : '') + minifyCSSInner(inner) + (closeM ? closeM[0] : ''));
      } else {
        outp.push(text); // script/pre/textarea untouched
      }
    }
    return outp.join('');
  }

  // ═══ SEGMENTED CONTAINER ═══
  // file record: [2B nameLen][name][4B segCount]
  //   segment:   [1B type 0=text|1=binary][4B len][data]
  function buildSegTLV(list) {
    var parts = [];
    for (var f = 0; f < list.length; f++) {
      var nameB = textToBytes(list[f].name);
      parts.push(concatBytes(u16ToBytes(nameB.length), nameB));
      parts.push(u32ToBytes(list[f].segs.length));
      for (var s = 0; s < list[f].segs.length; s++) {
        var seg = list[f].segs[s];
        var data = (seg.t === 0) ? textToBytes(seg.d) : seg.d;
        parts.push(concatBytes(
          concatBytes(new Uint8Array([seg.t]), u32ToBytes(data.length)), data));
      }
    }
    var total = 0;
    parts.forEach(function(p) { total += p.length; });
    var out = new Uint8Array(total);
    var off = 0;
    parts.forEach(function(p) { out.set(p, off); off += p.length; });
    return out;
  }

  function parseSegTLV(bytes) {
    var list = [];
    var i = 0, n = bytes.length;
    while (i < n) {
      if (i + 2 > n) throw 'Corrupt';
      var nameLen = (bytes[i] << 8) | bytes[i + 1]; i += 2;
      if (i + nameLen + 4 > n) throw 'Corrupt';
      var name = bytesToText(bytes.subarray(i, i + nameLen)); i += nameLen;
      var segCount = bytesToU32(bytes, i); i += 4;
      if (segCount > 100000) throw 'Corrupt';
      var html = '';
      for (var s = 0; s < segCount; s++) {
        if (i + 5 > n) throw 'Corrupt';
        var type = bytes[i]; i += 1;
        var dlen = bytesToU32(bytes, i); i += 4;
        if (i + dlen > n) throw 'Corrupt';
        if (type === 0) html += bytesToText(bytes.subarray(i, i + dlen));
        else html += bytesToB64(bytes.subarray(i, i + dlen));
        i += dlen;
      }
      list.push({ name: name, html: html });
    }
    return list;
  }

  // legacy plain TLV (LPZ3/LPZ2/LPL2)
  function parseTLV(bytes) {
    var list = [];
    var i = 0, n = bytes.length;
    while (i + 2 <= n) {
      var nameLen = (bytes[i] << 8) | bytes[i + 1];
      i += 2;
      if (i + nameLen + 4 > n) throw 'Corrupt';
      var name = bytesToText(bytes.subarray(i, i + nameLen));
      i += nameLen;
      var htmlLen = bytesToU32(bytes, i);
      i += 4;
      if (i + htmlLen > n) throw 'Corrupt';
      var html = bytesToText(bytes.subarray(i, i + htmlLen));
      i += htmlLen;
      list.push({ name: name, html: html });
    }
    if (i !== n) throw 'Corrupt';
    return list;
  }

  function buildTLV(list) {
    var parts = [];
    for (var i = 0; i < list.length; i++) {
      var nameB = textToBytes(list[i].name);
      var htmlB = textToBytes(list[i].html);
      parts.push(concatBytes(
        concatBytes(u16ToBytes(nameB.length), nameB),
        concatBytes(u32ToBytes(htmlB.length), htmlB)));
    }
    var total = 0;
    parts.forEach(function(p) { total += p.length; });
    var out = new Uint8Array(total);
    var off = 0;
    parts.forEach(function(p) { out.set(p, off); off += p.length; });
    return out;
  }

  // ═══ STREAM COMPRESSION ═══
  function compressStream(bytes, format) {
    return new Promise(function(resolve, reject) {
      var cs = new CompressionStream(format);
      var writer = cs.writable.getWriter();
      writer.write(bytes).then(function() { return writer.close(); }).catch(function() {});
      var chunks = [];
      var reader = cs.readable.getReader();
      function pump() {
        reader.read().then(function(result) {
          if (result.done) {
            var total = 0;
            chunks.forEach(function(c) { total += c.length; });
            var out = new Uint8Array(total);
            var off = 0;
            chunks.forEach(function(c) { out.set(c, off); off += c.length; });
            resolve(out);
          } else { chunks.push(result.value); pump(); }
        }).catch(reject);
      }
      pump();
    });
  }

  function decompressStream(bytes, format) {
    return new Promise(function(resolve, reject) {
      var ds = new DecompressionStream(format);
      var writer = ds.writable.getWriter();
      writer.write(bytes).then(function() { return writer.close(); }).catch(function() {});
      var chunks = [];
      var reader = ds.readable.getReader();
      function pump() {
        reader.read().then(function(result) {
          if (result.done) {
            var total = 0;
            chunks.forEach(function(c) { total += c.length; });
            var out = new Uint8Array(total);
            var off = 0;
            chunks.forEach(function(c) { out.set(c, off); off += c.length; });
            resolve(out);
          } else { chunks.push(result.value); pump(); }
        }).catch(reject);
      }
      pump();
    });

  function supportsFormat(fmt) {
    try { new CompressionStream(fmt); return true; } catch (e) { return false; }
  }

  // ═══ LZ FALLBACK ═══
  function lzCompress(bytes) {
    var WINDOW = 4096, MAX_MATCH = 255, MIN_MATCH = 4;
    var out = [];
    var i = 0, n = bytes.length;
    var hashTable = {};
    var hashChain = new Array(n);
    function hash(pos) {
      return ((bytes[pos] << 16) | (bytes[pos + 1] << 8) | bytes[pos + 2]) % 65536;
    }
    for (var j = 0; j < n - 2; j++) {
      var h = hash(j);
      hashChain[j] = hashTable[h] || -1;
      hashTable[h] = j;
    }
    while (i < n) {
      var bestLen = 0, bestDist = 0;
      if (i + MIN_MATCH <= n) {
        var h2 = hash(i);
        var candidate = hashTable[h2];
        var tries = 0;
        while (candidate !== -1 && candidate !== undefined && i - candidate <= WINDOW && tries < 32) {
          if (candidate < i) {
            var len = 0;
            var maxLen = Math.min(MAX_MATCH, n - i);
            while (len < maxLen && bytes[candidate + len] === bytes[i + len]) len++;
            if (len > bestLen) {
              bestLen = len; bestDist = i - candidate;
              if (len >= MAX_MATCH) break;
            }
          }
          candidate = hashChain[candidate];
          tries++;
        }
      }
      if (bestLen >= MIN_MATCH) {
        out.push(0x00, (bestDist >> 8) & 0xFF, bestDist & 0xFF, bestLen);
        i += bestLen;
      } else { out.push(0x01, bytes[i]); i++; }
    }
    return new Uint8Array(out);
  }

  function lzDecompress(bytes) {
    var out = [];
    var i = 0, n = bytes.length;
    while (i < n) {
      var marker = bytes[i];
      if (marker === 0x00) {
        if (i + 3 >= n) break;
        var dist = (bytes[i + 1] << 8) | bytes[i + 2];
        var len = bytes[i + 3];
        var start = out.length - dist;
        if (start < 0) throw 'Corrupt';
        for (var j = 0; j < len; j++) out.push(out[start + j]);
        i += 4;
      } else if (marker === 0x01) {
        if (i + 1 >= n) break;
        out.push(bytes[i + 1]);
        i += 2;
      } else throw 'Corrupt';
    }
    return new Uint8Array(out);
  }

  // ═══ RENDER ═══
  function render() {
    var list = $('fileList');
    list.innerHTML = '';
    files.sort(function(a, b) { return b.date - a.date; });
    for (var i = 0; i < files.length; i++) {
      (function(f) {
        var card = document.createElement('div');
        card.className = 'filecard';
        card.innerHTML =
          '<div class="ficon">&lt;/&gt;</div>' +
          '<div class="fmeta"><div class="fname">' + esc(f.name) + '</div>' +
          '<div class="finfo">' + fmtSize(f.size) + ' &middot; added ' + fmtDate(f.date) + '</div></div>' +
          '<div class="fbtns"><button class="runbtn">RUN</button>' +
          '<button class="rembtn">REMOVE</button></div>';
        card.querySelector('.runbtn').addEventListener('click', function() { runFile(f); });
        card.querySelector('.rembtn').addEventListener('click', function() { removeFile(f); });
        list.appendChild(card);
      })(files[i]);
    }
    $('listCount').textContent = 'LIBRARY — ' + files.length + ' FILE' + (files.length === 1 ? '' : 'S');
    $('emptyMsg').style.display = files.length ? 'none' : '';
  }

  // ═══ ADD ═══
  window.pickFile = function() { $('fileInput').click(); };

  $('fileInput').addEventListener('change', function() {
    addFiles(this.files);
    this.value = '';
  });

  function addFiles(fileList) {
    var valid = 0, skipped = 0, pending = fileList.length;
    if (!pending) return;
    Array.prototype.forEach.call(fileList, function(file) {
      var ok = /\.(html?|txt)$/i.test(file.name) || file.type === 'text/html';
      if (!ok) { skipped++; pending--; checkDone(); return; }
      var reader = new FileReader();
      reader.onload = function() {
        var rec = { id: Date.now() + Math.floor(Math.random() * 1000),
          name: file.name, size: file.size, date: Date.now(), html: reader.result };
        dbOp('readwrite', function(s) { return s.put(rec); }).then(function() {
          files.push(rec); valid++; pending--; checkDone();
        }).catch(function() { pending--; checkDone(); status('storage failed', 'err'); });
      };
      reader.onerror = function() { pending--; checkDone(); };
      reader.readAsText(file);
    });
    function checkDone() {
      if (pending > 0) return;
      render();
      if (valid) status('added ' + valid + ' file' + (valid === 1 ? '' : 's') + ' — saved', 'ok');
      if (skipped) status('skipped ' + skipped + ' (not .html)', 'err');
    }
  }

  var addbox = $('addbox');
  ['dragenter', 'dragover'].forEach(function(ev) {
    addbox.addEventListener(ev, function(e) {
      e.preventDefault(); e.stopPropagation(); addbox.classList.add('drag');
    });
  });
  ['dragleave', 'drop'].forEach(function(ev) {
    addbox.addEventListener(ev, function(e) {
      e.preventDefault(); e.stopPropagation(); addbox.classList.remove('drag');
    });
  });
  addbox.addEventListener('drop', function(e) {
    if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ═══ REMOVE ═══
  function removeFile(f) {
    dbOp('readwrite', function(s) { return s.delete(f.id); }).then(function() {
      files = files.filter(function(x) { return x.id !== f.id; });
      render();
      status('removed "' + f.name + '"', 'ok');
    });
  }
  window.clearAll = function() {
    if (!files.length) return;
    if (!confirm('Remove ALL ' + files.length + ' files?')) return;
    dbOp('readwrite', function(s) { return s.clear(); }).then(function() {
      files = []; render(); status('library cleared', 'ok');
    });
  };

  // ═══ EXPORT v4: minify → extract binaries → segTLV → deflate ═══
  window.exportPack = function() {
    if (!files.length) { status('library is empty — nothing to save', 'err'); return; }

    var rawSize = 0;
    files.forEach(function(f) { rawSize += f.html.length; });

    status('packing ' + files.length + ' file(s)... scanning for binary blobs');

    var entries = [];
    var totalBins = 0, totalBinBytes = 0;
    files.forEach(function(f) {
      var mini = preprocessHTML(f.html);
      var ex = extractBinaries(mini);
      totalBins += ex.binCount;
      totalBinBytes += ex.binTotal;
      entries.push({ name: f.name, segs: ex.segs });
    });

    var tlv = buildSegTLV(entries);

    var d = new Date();
    var stamp = d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
    var fname = 'library-' + stamp + '-' + files.length + 'files.launchpad';

    function finish(fileBytes, method) {
      var blob = new Blob([fileBytes], { type: 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
      var ratio = ((1 - fileBytes.length / rawSize) * 100).toFixed(1);
      var blobNote = totalBins > 0
        ? ' | ' + totalBins + ' blob(s) decoded: ' + fmtSize(totalBinBytes)
        : '';
      status('saved ' + files.length + ' files → ' + fname +
        ' | ' + fmtSize(rawSize) + ' → ' + fmtSize(fileBytes.length) +
        ' (-' + ratio + '%, ' + method + ')' + blobNote, 'ok');
    }

    function wrap(magic, data) {
      return concatBytes(concatBytes(textToBytes(magic), u32ToBytes(tlv.length)), data);
    }

    if (supportsFormat('deflate-raw')) {
      compressStream(tlv, 'deflate-raw').then(function(comp) {
        finish(wrap(MAGIC_RAW4, comp), 'min+bin+deflate-raw');
      }).catch(function() {
        if (supportsFormat('gzip')) {
          compressStream(tlv, 'gzip').then(function(c2) {
            finish(wrap(MAGIC_RAW4, c2), 'min+bin+gzip');
          }).catch(function() { finish(wrap(MAGIC_LZ4, lzCompress(tlv)), 'min+bin+lz'); });
        } else {
          finish(wrap(MAGIC_LZ4, lzCompress(tlv)), 'min+bin+lz');
        }
      });
    } else if (supportsFormat('gzip')) {
      compressStream(tlv, 'gzip').then(function(comp) {
        finish(wrap(MAGIC_RAW4, comp), 'min+bin+gzip');
      }).catch(function() { finish(wrap(MAGIC_LZ4, lzCompress(tlv)), 'min+bin+lz'); });
    } else {
      finish(wrap(MAGIC_LZ4, lzCompress(tlv)), 'min+bin+lz');
    }
  };

  // ═══ IMPORT — reads v4 + every legacy format ═══
  window.importPack = function() { $('packInput').click(); };

  $('packInput').addEventListener('change', function() {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function() {
      var raw = new Uint8Array(reader.result);
      var magic = bytesToText(raw.subarray(0, 10));

      function importList(list) {
        if (!list.length) { status('.launchpad contains no files', 'err'); return; }
        var existing = {};
        files.forEach(function(f) { existing[f.name + '|' + f.html.length] = true; });
        var added = 0, skipped = 0, pending = list.length;
        list.forEach(function(pf) {
          if (!pf.name || typeof pf.html !== 'string') { skipped++; pending--; check(); return; }
          if (existing[pf.name + '|' + pf.html.length]) { skipped++; pending--; check(); return; }
          var rec = {
            id: Date.now() + Math.floor(Math.random() * 1000),
            name: pf.name, size: pf.html.length, date: Date.now(), html: pf.html
          };
          dbOp('readwrite', function(s) { return s.put(rec); }).then(function() {
            files.push(rec); added++; pending--; check();
          }).catch(function() { skipped++; pending--; check(); });
        });
        function check() {
          if (pending > 0) return;
          render();
          status('loaded ' + added + ' file' + (added === 1 ? '' : 's') +
            (skipped ? ' | skipped ' + skipped + ' (already in library)' : ''), 'ok');
        }
      }

      function importJSON(jsonText) {
        var pack;
        try { pack = JSON.parse(jsonText); } catch (e) { status('corrupt file (bad JSON)', 'err'); return; }
        if (!pack || !pack.files || !pack.files.length) { status('invalid .launchpad', 'err'); return; }
        importList(pack.files);
      }

      function verifySeg(decomp, expected) {
        if (decomp.length !== expected) { status('corrupt file (size mismatch)', 'err'); return; }
        try { importList(parseSegTLV(decomp)); }
        catch (e) { status('corrupt file (bad container)', 'err'); }
      }

      function verifyLegacy(decomp, expected) {
        if (decomp.length !== expected) { status('corrupt file (size mismatch)', 'err'); return; }
        try { importList(parseTLV(decomp)); }
        catch (e) { status('corrupt file (bad container)', 'err'); }
      }

      function tryDecompress(bytes, format, then) {
        decompressStream(bytes, format).then(then).catch(function() {
          // v4 files written as gzip-fallback carry the same magic —
          // try deflate-raw then gzip before giving up
          if (format === 'gzip') {
            decompressStream(bytes, 'deflate-raw').then(then).catch(function() {
              status('decompression failed — corrupt file', 'err');
            });
          } else {
            status('decompression failed — corrupt file', 'err');
          }
        });
      }

      if (magic.indexOf(MAGIC_RAW4) === 0) {
        // v4: try deflate-raw, fall back to gzip (both wrote this magic)
        tryDecompress(raw.subarray(8), 'deflate-raw', function(dec) {
          verifySeg(dec, bytesToU32(raw, 4));
        });
      }
      else if (magic.indexOf(MAGIC_LZ4) === 0) {
        try { verifySeg(lzDecompress(raw.subarray(8)), bytesToU32(raw, 4)); }
        catch (e) { status('corrupt file', 'err'); }
      }
      else if (magic.indexOf(MAGIC_RAW3) === 0) {
        tryDecompress(raw.subarray(8), 'deflate-raw', function(dec) {
          verifyLegacy(dec, bytesToU32(raw, 4));
        });
      }
      else if (magic.indexOf(MAGIC_GZ2) === 0) {
        tryDecompress(raw.subarray(8), 'gzip', function(dec) {
          verifyLegacy(dec, bytesToU32(raw, 4));
        });
      }
      else if (magic.indexOf(MAGIC_LZ2) === 0) {
        try { verifyLegacy(lzDecompress(raw.subarray(8)), bytesToU32(raw, 4)); }
        catch (e) { status('corrupt file', 'err'); }
      }
      else if (magic.indexOf(MAGIC_GZ1) === 0) {
        tryDecompress(raw.subarray(8), 'gzip', function(dec) {
          importJSON(bytesToText(dec));
        });
      }
      else if (magic.indexOf(MAGIC_LZ1) === 0) {
        try { importJSON(bytesToText(lzDecompress(raw.subarray(8)))); }
        catch (e) { status('corrupt file', 'err'); }
      }
      else if (magic.indexOf(MAGIC_JSON) === 0) {
        importJSON(bytesToText(raw));
      }
      else {
        status('not a .launchpad file', 'err');
      }
    };
    reader.onerror = function() { status('failed to read file', 'err'); };
    reader.readAsArrayBuffer(file);
  });

  // ═══ RUN ═══
  function injectCloak(html) {
    var title = $('titleInput').value.trim();
    var icon = $('iconInput').value.trim();
    var inject = '';
    if (title) inject += '<title>' + esc(title) + '</title>';
    if (icon) inject += '<link rel="icon" href="' + esc(icon) + '">';
    if (!inject) return html;
    if (/<head[^>]*>/i.test(html)) {
      return html.replace(/<head[^>]*>/i, function(m) { return m + inject; });
    }
    return inject + html;
  }

  function runFile(f) {
    var html = injectCloak(f.html);
    var win;
    if (launchMode === 'blank') {
      win = window.open('about:blank', '_blank');
      if (!win) { status('popup blocked — allow popups and press RUN again', 'err'); return; }
      win.document.open();
      win.document.write(html);
      win.document.close();
      status('running "' + f.name + '" in about:blank tab', 'ok');
    } else {
      var blob = new Blob([html], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      win = window.open(url, '_blank');
      if (!win) { status('popup blocked — allow popups and press RUN again', 'err'); return; }
      status('running "' + f.name + '" as blob: tab', 'ok');
      setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
    }
    if ($('fullscreenChk').checked && win) {
      try {
        var t = win.document && win.document.documentElement;
        if (t && t.requestFullscreen) t.requestFullscreen().catch(function() {});
      } catch (e) {}
    }
  }

  // ═══ CONFIG ═══
  window.toggleSettings = function() { $('settings').classList.toggle('open'); };
  window.setMode = function(m) {
    launchMode = m;
    $('modeBlank').classList.toggle('active', m === 'blank');
    $('modeBlob').classList.toggle('active', m === 'blob');
    try { localStorage.setItem('lx_mode', m); } catch (e) {}
  };
  window.selfCloak = function() {
    var title = $('titleInput').value.trim();
    if (title) document.title = title;
    status('tab cloaked' + (title ? ' -> ' + title : ''), 'ok');
  };

  document.getElementById('lockBtn').addEventListener('click', function() {
    showScreen('calcScreen');
  });

  // ═══ INIT ═══
  openDB().then(function(database) {
    db = database;
    return dbOp('readonly', function(s) { return s.getAll(); });
  }).then(function(recs) {
    files = recs || [];
    render();
  }).catch(function() {
    status('storage unavailable — session only', 'err');
  });

  try {
    var m = localStorage.getItem('lx_mode');
    if (m === 'blob' || m === 'blank') launchMode = m;
  } catch (e) {}
  window.setMode(launchMode);
})();
</script>
</body>
</html>
